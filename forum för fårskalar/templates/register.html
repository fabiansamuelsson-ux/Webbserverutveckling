{% extends "base.html" %}

{% block title %}Skapa konto – Fårforum{% endblock %}

{% block content %}
    <section class="auth-wrap">
        <div class="auth-card card">
            <h1>Skapa konto</h1>
            <form method="post" class="auth-form" enctype="multipart/form-data">
                <label for="username">Användarnamn</label>
                <input id="username" name="username" type="text" maxlength="30" autocomplete="username"
                    pattern="[A-Za-z0-9_]+" title="Bokstäver, siffror och understreck" required>
                <label for="profile_picture">Profilbild (valfritt)</label>
                <input id="profile_picture" name="profile_picture" type="file"
                    accept="image/png,image/jpeg,image/gif,image/webp">
                <label for="password">Lösenord</label>
                <input id="password" name="password" type="password" minlength="8"
                    autocomplete="new-password" required>
                <button class="button button-full" type="submit">Skapa konto</button>
            </form>
            <p class="auth-switch">Har du redan ett konto? <a href="{{ url_for('login') }}">Logga in</a>.</p>
        </div>
    </section>
{% endblock %}
