{% extends "base.html" %}

{% block title %}Logga in – Fårforum{% endblock %}

{% block content %}
    <section class="auth-wrap">
        <div class="auth-card card">
            <p class="eyebrow">VÄLKOMMEN TILLBAKA</p>
            <h1>Logga in</h1>
            <p class="auth-copy">Flocken har saknat dig.</p>
            <form method="post" class="auth-form">
                <label for="username">Användarnamn</label>
                <input id="username" name="username" type="text" maxlength="30" autocomplete="username" required>
                <label for="password">Lösenord</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <button class="button button-full" type="submit">Logga in</button>
            </form>
            <p class="auth-switch">Inget konto än? <a href="{{ url_for('register') }}">Skapa ett här</a>.</p>
        </div>
    </section>
{% endblock %}
